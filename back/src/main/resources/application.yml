spring:
    application:
        name: igestor-back

    profiles:
        active: dev

    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5433/igestor}
        username: ${DB_USERNAME:igestor}
        password: ${DB_PASSWORD:igestor}

    jpa:
        hibernate:
            ddl-auto: update
        open-in-view: false
        properties:
            hibernate:
                format_sql: true
server:
    port: ${SERVER_PORT:8081}
