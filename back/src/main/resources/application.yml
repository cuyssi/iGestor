spring:
    application:
        name: igestor-back

    profiles:
        active: ${SPRING_PROFILES_ACTIVE:}
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5433/igestor}
        username: ${DB_USERNAME:igestor}
        password: ${DB_PASSWORD:igestor}

    jpa:
        hibernate:
            ddl-auto: update
        open-in-view: false
        properties:
            hibernate:
                format_sql: true
server:
    port: ${SERVER_PORT:8081}

app:
    security:
        jwt:
            issuer: igestor
            secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me-change-me}
            access-token-ttl: 15m
